services:
  # MongoDB Database
  # mongodb:
  #   image: mongo:7.0
  #   container_name: rakc-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db
  #   environment:
  #     - MONGO_INITDB_DATABASE=rakc-platform
  #     - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
  #     - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
  #     - APPUSER_PASSWORD=${APPUSER_PASSWORD}
  #   networks:
  #     - rakc-network

  # Backend API Service
  backend:
    image: ghcr.io/commitsbyimmanuel/rakc-bookstore-backend:v2.0
    build: ./backend
    container_name: rakc-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - BOOKSTORE_DB_URI=${DB_URI}
      - PORT=3001
      - NODE_ENV=production
      - BOOKSTORE_AUTH_URL=${BOOKSTORE_AUTH_URL:-https://admin.rakchurch.com}
      - BOOKSTORE_PUBLIC_URL=${BOOKSTORE_PUBLIC_URL:-http://bookstore.local}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    networks:
      - rakc-network

  # Frontend Web Application
  frontend:
    image: ghcr.io/commitsbyimmanuel/rakc-bookstore-frontend:v2.0
    build: ./frontend
    container_name: rakc-frontend
    restart: unless-stopped
    environment:
      - BOOKSTORE_API_UPSTREAM=http://backend:3001
    ports:
      - "${BOOKSTORE_BIND_ADDRESS:-127.0.0.1}:${BOOKSTORE_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - rakc-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rakc-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rakc-network

  # Email Service
  email-service:
    image: ghcr.io/commitsbyimmanuel/rakc-bookstore-email-service:v1.0.1
    container_name: rakc-email-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGODB_URI=${DB_URI}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      - rabbitmq
    networks:
      - rakc-network

volumes:
  mongodb_data:
    driver: local

networks:
  rakc-network:
    driver: bridge
